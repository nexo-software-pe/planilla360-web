<div class="portal">
  <header class="cabecera">
    <div>
      <p class="cabecera__saludo">Hola, {{ usuario()?.nombre }}</p>
      @if (empresa(); as e) {
        <p class="cabecera__empresa">{{ e.razonSocial }}</p>
      }
    </div>
    <button type="button" class="cabecera__salir" aria-label="Cerrar sesión" (click)="salir()">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false">
        <path
          d="M9 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h4M16 17l5-5-5-5M21 12H9"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </button>
  </header>

  <main class="portal__contenido">
    <router-outlet />
  </main>

  <nav class="barra" aria-label="Navegación del portal">
    @for (item of items(); track item.ruta) {
      <a
        class="barra__item"
        [routerLink]="item.ruta"
        routerLinkActive="barra__item--activo"
        [routerLinkActiveOptions]="{ exact: true }"
        ariaCurrentWhenActive="page"
        >{{ item.etiqueta }}</a
      >
    }
  </nav>
</div>
